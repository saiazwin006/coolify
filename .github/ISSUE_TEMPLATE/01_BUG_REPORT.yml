name: 🐞 Bug Report
description: "File a new bug report."
title: "[Bug]: WSL Docker detection / service restart failure"
labels: ["🐛 Bug", "🔍 Triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Please ensure you are using the latest version of Coolify before submitting an issue, as the bug may have already been fixed in a recent update.** (Of course, if you're experiencing an issue on the latest version that wasn't present in a previous version, please let us know.)

        # 💎 Bounty Program (with [algora.io](https://console.algora.io/org/coollabsio/bounties/new))
        - If you would like to prioritize the issue resolution, consider adding a bounty to this issue through our [Bounty Program](https://console.algora.io/org/coollabsio/bounties/new).

  - type: textarea
    attributes:
      label: Error Message and Logs
      description: Provide a detailed description of the error or exception you encountered, along with any relevant log output.
      value: |
        WSL DETECTED: We recommend using Docker Desktop for Windows.
        Please get Docker Desktop from https://www.docker.com/products/docker-desktop/

        Failed to restart docker.service: Unit docker.service not found.

        During installation, the script tries to restart Docker but fails because WSL (Windows Subsystem for Linux) does not use systemd or docker.service by default. 
        The script continues but might leave Docker partially configured or detached from the daemon.

        Installing Coolify (4.0.0-beta.434)
        Docker image hash: 1a74b9ea2d94c6770bd41d7595deb702fa88d8621601dbedea1219cbf0f6871a

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Please provide a step-by-step guide to reproduce the issue. Be as detailed as possible, otherwise we may not be able to assist you.
      value: |
        1. Run Ubuntu 22.04 in WSL2 on Windows 11.  
        2. Install Coolify using: `curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash`  
        3. Observe warning: `WSL DETECTED: We recommend using Docker Desktop for Windows.`  
        4. Docker installation continues, but systemctl commands fail: `Failed to restart docker.service: Unit docker.service not found.`  
        5. Installation proceeds, but Docker may not be properly linked with Coolify.

  - type: input
    attributes:
      label: Example Repository URL
      description: If applicable, provide a URL to a repository demonstrating the issue.

  - type: input
    attributes:
      label: Coolify Version
      description: Please provide the Coolify version you are using. This can be found in the top left corner of your Coolify dashboard.
      value: "v4.0.0-beta.434"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Are you using Coolify Cloud?
      options:
        - "No (self-hosted)"
        - "Yes (Coolify Cloud)"
      value: "No (self-hosted)"
    validations:
      required: true

  - type: input
    attributes:
      label: Operating System and Version (self-hosted)
      description: Run `cat /etc/os-release` or `lsb_release -a` in your terminal and provide the operating system and version.
      value: "Ubuntu 22.04 LTS (WSL2 on Windows 11)"

  - type: textarea
    attributes:
      label: Additional Information
      description: Any other relevant details about the issue.
      value: |
        - Docker CLI installs successfully and reports version 28.5.1, but systemd isn’t available inside WSL.  
        - The install script assumes `systemctl restart docker` exists, which fails in WSL environments.  
        - Suggest adding a check in the script to skip `systemctl` operations when `WSL_DETECTED=true` and verify Docker connectivity instead (`docker ps` check).  
        - Otherwise, the script logs an error but proceeds, which could confuse users or lead to partial installs.
